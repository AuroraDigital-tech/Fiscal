{t:"A Base e os Regimes",au:"Aulas 1 e 2",l:"<h3>Aula 1: Para que serve o setor fiscal?</h3><p><b>A empresa tem “dois patrões”.</b> Pense numa loja de bairro. O dono quer vender e lucrar, mas a cada venda existe um “sócio invisível” que também precisa receber: o governo. Parte do preço que o cliente paga não é da empresa: é imposto, que ela apenas recolhe e repassa. O setor fiscal calcula quanto é devido, registra tudo e presta contas ao governo.</p><h3>Vocabulário mínimo</h3><p><b>Tributo:</b> pagamento obrigatório ao governo, previsto em lei (imposto é o tipo mais comum). <b>Fato gerador:</b> a situação que faz nascer o imposto (vender, prestar serviço, fabricar). <b>Contribuinte:</b> quem paga o imposto (a empresa). <b>Base de cálculo:</b> o valor sobre o qual o imposto é calculado. <b>Alíquota:</b> o percentual do imposto.</p><p class='tip'><b>Fórmula de ouro:</b> imposto = base de cálculo × alíquota. Venda de R$ 1.000 com 18%: 1.000 × 0,18 = R$ 180.</p><h3>Quem cobra o quê</h3><table><tr><th>Nível</th><th>Quem cobra</th><th>Exemplos</th></tr><tr><td>Federal</td><td>União (Receita Federal)</td><td>IPI, PIS, COFINS (e IRPJ/CSLL, que vêm do lucro)</td></tr><tr><td>Estadual</td><td>Estado (em MG, SEF/MG)</td><td>ICMS</td></tr><tr><td>Municipal</td><td>Prefeitura</td><td>ISS</td></tr></table><p class='s'>Truque: ICMS tem “E” de Estadual; ISS tem “S” de Serviço e é da prefeitura (Município); IPI é federal e vem da Indústria.</p><h3>Por que escriturar?</h3><p>Escriturar é registrar nos livros fiscais todas as notas que entraram e saíram. Serve para (1) calcular o imposto certo, (2) provar ao governo que a empresa agiu corretamente e (3) evitar multas. O governo sabe se algo foi esquecido: toda nota eletrônica é autorizada pela SEFAZ, então o Fisco já recebe uma cópia. Depois, o SPED é cruzado com essas notas, e se a empresa deixou de lançar uma, a diferença aparece.</p><h3>O caminho de um documento</h3><ol><li>A empresa compra ou vende.</li><li>O documento fiscal é emitido.</li><li>Ele chega até você.</li><li>Você confere.</li><li>Você lança e classifica no sistema (escritura).</li><li>O sistema ajuda a apurar os impostos.</li><li>Gera-se o SPED e outras declarações.</li><li>Faz-se a conciliação (para achar diferenças).</li><li>Tudo é arquivado para auditoria.</li></ol><p class='tip'><b>Na prática:</b> seu dia é sobretudo as etapas 4, 5, 8 e 9, com apoio nas etapas 6 e 7.</p><p class='tip'><b>Erro comum:</b> achar que “lançar” é só digitar. Lançar é entender o que a nota representa e classificar certo.</p><h3>Aula 2: Regimes tributários e tipos de empresa</h3><p><b>Por que isso importa tanto?</b> O regime é a “forma de pagar imposto” que a empresa escolheu (ou foi obrigada a usar). Dois colegas lançam a mesma nota em empresas diferentes e o tratamento pode ser totalmente diferente. A primeira pergunta no trabalho deve ser: “qual é o regime desta empresa?”</p><p><b>1) Simples Nacional:</b> voltado a pequenas empresas (limite de faturamento anual hoje na casa de R$ 4,8 milhões; confira o limite vigente). Os impostos são pagos juntos em uma guia única, o <b>DAS</b>, calculado sobre o faturamento. ICMS e ISS ficam dentro do DAS (em regra). As notas usam <b>CSOSN</b> em vez de CST. Em geral é dispensado do SPED Fiscal, mas a regra pode variar por estado: confirme.</p><p><b>2) Lucro Presumido:</b> o governo presume uma margem de lucro sobre o faturamento para calcular IRPJ e CSLL. PIS e COFINS são <b>cumulativos</b> (sem créditos): 0,65% e 3%. ICMS, IPI e ISS seguem as regras normais.</p><p><b>3) Lucro Real:</b> IRPJ/CSLL partem do lucro contábil ajustado, não de uma presunção. PIS e COFINS são <b>não cumulativos</b> (com créditos): 1,65% e 7,6%. É o regime mais detalhado e exige mais controle de créditos.</p><h3>Também precisa saber: o ramo da empresa</h3><table><tr><th>Ramo</th><th>O que costuma aparecer no fiscal</th></tr><tr><td>Comércio</td><td>Compra para revenda, ICMS, ST, PIS/COFINS</td></tr><tr><td>Indústria</td><td>Matéria-prima, IPI, produção, estoque</td></tr><tr><td>Serviços</td><td>NFS-e, ISS, retenções</td></tr></table><p class='tip'><b>Na prática:</b> abra o cadastro da empresa no sistema, descubra regime e ramo e anote no caderno. Isso guia tudo.</p><p class='tip'><b>Erro comum:</b> copiar o jeito de lançar de uma empresa e aplicar em outra sem checar o regime.</p><p class='tip'><b>Pare e pense:</b> se a empresa é do Lucro Real e comprou mercadoria para revenda, ela pode ter crédito de PIS/COFINS? (Não cumulativo = com créditos.)</p>",
q:[["O ICMS é cobrado por qual nível?",["União","Estado","Município"],1,"O ICMS é estadual (em MG, SEF/MG). ISS é municipal; IPI, PIS e COFINS são federais."],

{t:"O Documento Fiscal",au:"Aulas 3 e 4",l:"<h3>Aula 3: A nota fiscal por dentro</h3><p><b>Tipos de documento:</b> NF-e (modelo 55, mercadorias entre empresas); NFC-e (modelo 65, consumidor/varejo); NFS-e (serviços, prefeitura ou padrão nacional); CT-e (conhecimento de transporte, frete).</p><p><b>XML x DANFE:</b> o XML é o arquivo oficial, com valor legal. O DANFE é o PDF/impressão para humanos lerem. Se há diferença, vale o XML. Guarde sempre o XML.</p><h3>A chave de acesso (44 dígitos)</h3><p>É o “CPF da nota”. Com ela você consulta a nota no portal da NF-e e vê se está autorizada.</p><table><tr><th>Posição</th><th>Dígitos</th><th>O que é</th></tr><tr><td>1 a 2</td><td>2</td><td>Código da UF (31 = Minas Gerais)</td></tr><tr><td>3 a 6</td><td>4</td><td>Ano e mês de emissão (2610 = outubro de 2026)</td></tr><tr><td>7 a 20</td><td>14</td><td>CNPJ do emitente</td></tr><tr><td>21 a 22</td><td>2</td><td>Modelo (55 = NF-e)</td></tr><tr><td>23 a 25</td><td>3</td><td>Série</td></tr><tr><td>26 a 34</td><td>9</td><td>Número da nota</td></tr><tr><td>35</td><td>1</td><td>Tipo de emissão</td></tr><tr><td>36 a 43</td><td>8</td><td>Código numérico aleatório</td></tr><tr><td>44</td><td>1</td><td>Dígito verificador</td></tr></table><h3>Lendo uma nota, campo por campo</h3><table><tr><th>Campo</th><th>Para que serve</th></tr><tr><td>Natureza da operação</td><td>Descreve o tipo de operação (ex.: venda de mercadoria)</td></tr><tr><td>Emitente</td><td>Quem vendeu</td></tr><tr><td>Destinatário</td><td>Quem comprou (confira o CNPJ!)</td></tr><tr><td>Item</td><td>O que foi vendido e como foi classificado (ex.: camiseta, NCM 6109.10.00, CFOP 5102)</td></tr><tr><td>Qtd × valor unitário</td><td>100 × R$ 20,00 = total do item R$ 2.000,00</td></tr><tr><td>ICMS do item</td><td>Imposto destacado (ex.: CST 00, base 2.000, alíquota 18%, valor 360)</td></tr><tr><td>PIS/COFINS</td><td>Situação (CST) e valores</td></tr><tr><td>Totais</td><td>Produtos, frete, desconto, total: precisam fechar com a soma dos itens</td></tr><tr><td>Transporte</td><td>Frete por conta de quem</td></tr><tr><td>Cobrança</td><td>Duplicatas e vencimentos; alimenta o contas a pagar</td></tr><tr><td>Informações adicionais</td><td>Textos livres (ex.: FEM em MG)</td></tr><tr><td>Protocolo de autorização</td><td>Número e data: prova de que a SEFAZ autorizou</td></tr></table><h3>Eventos da NF-e</h3><p><b>Cancelamento:</b> a nota deixa de ter efeito; em regra há prazo curto (geralmente 24 horas, mas depende da legislação). Depois, o caminho costuma ser a devolução. <b>Carta de Correção (CC-e):</b> corrige apenas dados que não mudam valor, imposto, destinatário ou data. <b>Manifestação do destinatário:</b> a empresa informa ao Fisco que confirmou, desconheceu ou não realizou a operação.</p><p class='tip'><b>Na prática:</b> antes de lançar, consulte a situação no portal. Se cancelou, não entra.</p><p class='tip'><b>Erro comum:</b> lançar pelo PDF que chegou por e-mail sem conferir se a nota foi autorizada.</p><h3>Aula 4: CFOP, CST/CSOSN e NCM</h3><p><b>CFOP</b> tem 4 dígitos e diz o tipo de operação. O primeiro dígito indica sentido e destino:</p><table><tr><th>1º dígito</th><th>Significado</th></tr><tr><td>1</td><td>Entrada, do mesmo estado</td></tr><tr><td>2</td><td>Entrada, de outro estado</td></tr><tr><td>3</td><td>Entrada, do exterior</td></tr><tr><td>5</td><td>Saída, para o mesmo estado</td></tr><tr><td>6</td><td>Saída, para outro estado</td></tr><tr><td>7</td><td>Saída, para o exterior</td></tr></table><table><tr><th>CFOP</th><th>Significado</th></tr><tr><td>5101 / 6101</td><td>Venda de produção própria (dentro / fora do estado)</td></tr><tr><td>5102 / 6102</td><td>Venda de mercadoria adquirida de terceiros</td></tr><tr><td>1102 / 2102</td><td>Compra para comercialização</td></tr><tr><td>1202 / 2202</td><td>Devolução de venda</td></tr><tr><td>5202 / 6202</td><td>Devolução de compra</td></tr><tr><td>5949 / 1949</td><td>Outras saídas / entradas (uso genérico, confira se é o caso)</td></tr></table><h3>A regra de ouro da “inversão”</h3><p>O fornecedor emite a nota com o CFOP dele (saída: 5 ou 6). Você, ao escriturar a entrada, usa o CFOP correspondente de entrada (1 ou 2):</p><table><tr><th>Fornecedor emitiu</th><th>Origem</th><th>Você escritura</th></tr><tr><td>5102</td><td>Mesmo estado</td><td>1102</td></tr><tr><td>6102</td><td>Outro estado</td><td>2102</td></tr><tr><td>6101</td><td>Outro estado</td><td>2101</td></tr></table><p class='tip'><b>Erro comum:</b> escriturar a entrada com o mesmo CFOP da nota do fornecedor.</p><h3>CST e CSOSN: a situação do imposto</h3><p><b>CST do ICMS</b> (regime normal) tem 3 dígitos: o primeiro é a origem da mercadoria (0 = nacional, 1 = estrangeira de importação direta etc.) e os dois últimos, a tributação. Exemplos: 00 tributada integralmente; 10 tributada com ST; 20 com redução de base; 40 isenta; 41 não tributada; 51 diferimento; 60 ICMS cobrado anteriormente por ST. <b>CSOSN</b> é o equivalente para o Simples (ex.: 101, 102, 500). PIS/COFINS e IPI têm tabelas de CST próprias.</p><p class='tip'><b>Na prática:</b> o CST diz se o item gera crédito ou débito e como entra na apuração.</p><h3>NCM e CEST</h3><p><b>NCM:</b> código de 8 dígitos que classifica a mercadoria; dele dependem IPI, ST, tributação de PIS/COFINS etc. <b>CEST:</b> código de 7 dígitos usado em mercadorias com substituição tributária.</p><p class='tip'><b>Erro comum:</b> cadastrar o produto com o NCM errado. O erro se repete em todas as notas daquele produto.</p>",

{t:"Dominando os Impostos",au:"Aulas 5 a 8 e 12",l:"<h3>Aula 5: ICMS, o imposto estadual</h3><p><b>A história das laranjas.</b> Você compra uma caixa por R$ 100, já com R$ 18 de ICMS embutido (18%). Vende por R$ 200, com R$ 36 de ICMS. Como já adiantou R$ 18 na compra, repassa só R$ 36 − R$ 18 = R$ 18. O ICMS incide sobre o valor que você agregou, não duas vezes sobre o mesmo valor: isso é a <b>não cumulatividade</b>.</p><p class='tip'><b>ICMS a pagar = débitos (vendas) − créditos (compras com direito).</b> Se os créditos forem maiores, sobra saldo credor, transportado para o mês seguinte.</p><p><b>“Por dentro”:</b> o imposto já está incluído no preço; a nota apenas o destaca em campo próprio.</p><table><tr><th>Operação</th><th>Alíquota (regra geral)</th></tr><tr><td>Interna em MG</td><td>18%, com exceções por produto</td></tr><tr><td>MG para Sul e Sudeste (exceto ES)</td><td>12%</td></tr><tr><td>MG para Norte, Nordeste, Centro-Oeste e ES</td><td>7%</td></tr><tr><td>Importados (interestadual)</td><td>4%</td></tr></table><p><b>Substituição tributária (ST):</b> o estado cobra o imposto de toda a cadeia de uma vez, de um substituto (fabricante/importador). Quem compra depois recebe a mercadoria com o ICMS já pago e, em geral, não destaca nem paga de novo. O CST de ST (10, 30, 60, 70) e o CEST avisam: nunca trate como mercadoria normal.</p><p><b>DIFAL:</b> em venda interestadual a consumidor final não contribuinte, o destino fica com a diferença entre a alíquota interna e a interestadual. SP para consumidor em MG: 18% − 12% = 6 pontos percentuais, devidos a Minas.</p><p><b>FEM (só em MG):</b> adicional de 2 pontos percentuais em certas mercadorias (lista definida em norma), em operações internas para consumidor final. A nota precisa trazê-lo corretamente.</p><p><b>Quando NÃO há crédito:</b> em regra, uso e consumo (ex.: material de limpeza) e mercadorias com isenção ou não tributação. Pergunte à equipe como o sistema trata. <b>Outros termos:</b> diferimento (imposto adiado), isenção/redução de base, CIAP (crédito de bens do ativo imobilizado, em regra 1/48 por mês).</p><p class='tip'><b>Erro comum:</b> tomar crédito sem conferir se a operação dá direito. Crédito indevido é um dos erros mais caros em autuação.</p><h3>Aula 6: IPI, imposto sobre produtos industrializados</h3><p>É federal e incide sobre produtos industrializados: o contribuinte é quem fabrica ou importa. No comércio puro, o IPI vem destacado na compra, mas em regra não gera crédito (vira custo). Existem casos de equiparação a industrial: confirme com a equipe.</p><p><b>Cálculo “por fora”:</b> produto de R$ 1.000 com IPI de 10% → IPI R$ 100; total cobrado R$ 1.100. A alíquota vem do <b>NCM</b>, na tabela <b>TIPI</b> (“NT” = não tributado). É não cumulativo: débito de saída − crédito de entrada.</p><p class='tip'><b>Erro comum:</b> confundir “por dentro” (ICMS) com “por fora” (IPI) ao conferir o total da nota.</p><h3>Aula 7: PIS e COFINS</h3><p>Contribuições federais sobre o faturamento. Aparecem juntas.</p><table><tr><th>Modelo</th><th>Quem usa (em regra)</th><th>Créditos?</th><th>PIS</th><th>COFINS</th></tr><tr><td>Cumulativo</td><td>Lucro Presumido</td><td>Não</td><td>0,65%</td><td>3%</td></tr><tr><td>Não cumulativo</td><td>Lucro Real</td><td>Sim</td><td>1,65%</td><td>7,6%</td></tr></table><p><b>Cumulativo:</b> receita R$ 80.000 → PIS 520 + COFINS 2.400 = R$ 2.920. <b>Não cumulativo:</b> receita R$ 100.000 e compras com crédito de R$ 40.000 → débito PIS 1.650 e COFINS 7.600; crédito PIS 660 e COFINS 3.040; a pagar PIS 990 e COFINS 4.560 (total R$ 5.550).</p><p><b>Geram crédito (não cumulativo), em geral:</b> mercadorias para revenda, insumos, energia elétrica, aluguéis, fretes na compra e depreciação de bens. Use as regras que a empresa já adota.</p><p><b>Regimes especiais:</b> <b>monofásico</b> (imposto concentrado no fabricante/importador; o revendedor, em regra, tem alíquota zero) e alíquota zero, isenção, suspensão (sem imposto a pagar, mas o CST precisa estar correto). O <b>CST de PIS/COFINS</b> é o que o SPED Contribuições lê: 01 tributável básica, 04 monofásica com alíquota zero, 06 alíquota zero, 07 isenta, 08 sem incidência. O STF decidiu que o ICMS não compõe a base do PIS/COFINS: pergunte como a empresa aplica.</p><p class='tip'><b>Erro comum:</b> deixar o CST de PIS/COFINS “genérico” por pressa. Gera erro no SPED e imposto errado.</p><h3>Aula 8: ISS, NFS-e e retenções</h3><p><b>ISS:</b> imposto municipal sobre serviços (Lei Complementar 116/2003), alíquota de 2% a 5% definida pela prefeitura. R$ 10.000 a 3% = R$ 300. <b>NFS-e:</b> nota de serviços eletrônica; o padrão nacional está sendo adotado e algumas prefeituras, como Belo Horizonte, já exigem o Emissor Nacional conforme cronograma.</p><p><b>Prestador</b> faz o serviço e emite a nota; <b>tomador</b> contrata e recebe. Às vezes a lei manda o tomador reter o ISS e pagá-lo à prefeitura: NFS-e de R$ 5.000 com ISS de 3% retido → retido R$ 150; pago ao prestador R$ 4.850 (sem outras retenções).</p><p><b>Outras retenções comuns:</b> IRRF; CSLL, PIS e COFINS (em certos serviços, na casa de 4,65%); INSS (cessão de mão de obra, em regra 11%); ISS. Não decore percentuais: aplique a tabela interna da empresa e pergunte nos casos novos.</p><p class='tip'><b>Erro comum:</b> pagar o valor bruto da nota ao prestador sem descontar a retenção devida.</p><h3>Aula 12: Apuração na prática</h3><p>Apurar é calcular, no fim do mês, quanto de cada imposto pagar (ou quanto de crédito sobrou). Escrituração certa = apuração certa.</p><table><tr><th>Linha da apuração do ICMS</th></tr><tr><td>(+) Débitos das saídas</td></tr><tr><td>(+) Outros débitos / estornos de crédito</td></tr><tr><td>(−) Créditos das entradas</td></tr><tr><td>(−) Outros créditos</td></tr><tr><td>(−) Saldo credor do mês anterior</td></tr><tr><td>= ICMS a recolher ou saldo credor a transportar</td></tr></table><p>Exemplo 1: débitos 40.000 e créditos 25.000 → recolher R$ 15.000. Exemplo 2: débitos 40.000 e créditos 55.000 → saldo credor de R$ 15.000, sem pagamento. <b>PIS/COFINS cumulativo:</b> receita R$ 200.000 → PIS R$ 1.300 e COFINS R$ 6.000. <b>ISS:</b> receita de serviços R$ 60.000 a 2% = R$ 1.200 (com ajustes de retenções).</p><p><b>Como você ajuda:</b> garantir todas as notas lançadas; conferir CFOP/CST das notas de maior valor; revisar o relatório e comparar com o mês anterior; conferir créditos estranhos; avisar o responsável antes do vencimento.</p><p class='tip'><b>Pare e pense:</b> se o ICMS do mês dobrou, o que verificar primeiro? Vendas em duplicidade ou créditos de compras não lançados.</p>",

if(n==6)h+='<button onclick="cert()" style="margin-top:12px">Ver certificado</button>';A.innerHTML=h}
function lesson(i){A.innerHTML='<button class="g" onclick="home()">← Voltar</button><h2>Módulo '+(i+1)+': '+M[i].t+'</h2><div class="card">'+M[i].l+'</div><button onclick="quiz('+i+')">Começar quiz ('+M[i].q.length+' questões)</button>'}
function quiz(i){cur={i:i,qs:M[i].q.map(function(_,k){return k}),seen:{},pos:0};ask()}
function ask(){var c=cur,k=c.qs[0];if(k===undefined)return fin();var q=M[c.i].q[k];
var h='<div class="s t">Restam '+c.qs.length+' · Módulo '+(c.i+1)+'</div><h2>'+q[0]+'</h2>';
q[1].forEach(function(o,j){h+='<button class="o" onclick="pick('+j+')">'+o+'</button>'});A.innerHTML=h+'<div id="fb"></div>'}
function pick(j){var c=cur,k=c.qs[0],q=M[c.i].q[k],ok=j==q[2],bs=A.querySelectorAll(".o");
bs.forEach(function(b,x){b.disabled=true;if(x==q[2])b.classList.add("ok");else if(x==j)b.classList.add("no")});
if(!c.seen[k]){c.seen[k]=1;S.tot++;if(ok)S.ft++;save()}
c.qs.shift();if(!ok)c.qs.push(k);
document.getElementById("fb").innerHTML='<div class="card"><b class="t">'+(ok?'Correto!':'Quase lá.')+'</b> '+q[3]+(ok?'':'<br><span class="s">Esta questão volta no fim do quiz para fixar.</span>')+'</div><button onclick="ask()">Continuar</button>'}
