{t:"A Base e os Regimes",au:"Aulas 1 e 2",l:"<h3>Aula 1: Para que serve o setor fiscal?</h3><p><b>A empresa tem “dois patrões”.</b> Pense numa loja de bairro. O dono quer vender e lucrar, mas a cada venda existe um “sócio invisível” que também precisa receber: o governo. Parte do preço que o cliente paga não é da empresa: é imposto, que ela apenas recolhe e repassa. O setor fiscal calcula quanto é devido, registra tudo e presta contas ao governo.</p><h3>Vocabulário mínimo</h3><p><b>Tributo:</b> pagamento obrigatório ao governo, previsto em lei (imposto é o tipo mais comum). <b>Fato gerador:</b> a situação que faz nascer o imposto (vender, prestar serviço, fabricar). <b>Contribuinte:</b> quem paga o imposto (a empresa). <b>Base de cálculo:</b> o valor sobre o qual o imposto é calculado. <b>Alíquota:</b> o percentual do imposto.</p><p class='tip'><b>Fórmula de ouro:</b> imposto = base de cálculo × alíquota. Venda de R$ 1.000 com 18%: 1.000 × 0,18 = R$ 180.</p><h3>Quem cobra o quê</h3><table><tr><th>Nível</th><th>Quem cobra</th><th>Exemplos</th></tr><tr><td>Federal</td><td>União (Receita Federal)</td><td>IPI, PIS, COFINS (e IRPJ/CSLL, que vêm do lucro)</td></tr><tr><td>Estadual</td><td>Estado (em MG, SEF/MG)</td><td>ICMS</td></tr><tr><td>Municipal</td><td>Prefeitura</td><td>ISS</td></tr></table><p class='s'>Truque: ICMS tem “E” de Estadual; ISS tem “S” de Serviço e é da prefeitura (Município); IPI é federal e vem da Indústria.</p><h3>Por que escriturar?</h3><p>Escriturar é registrar nos livros fiscais todas as notas que entraram e saíram. Serve para (1) calcular o imposto certo, (2) provar ao governo que a empresa agiu corretamente e (3) evitar multas. O governo sabe se algo foi esquecido: toda nota eletrônica é autorizada pela SEFAZ, então o Fisco já recebe uma cópia. Depois, o SPED é cruzado com essas notas, e se a empresa deixou de lançar uma, a diferença aparece.</p><h3>O caminho de um documento</h3><ol><li>A empresa compra ou vende.</li><li>O documento fiscal é emitido.</li><li>Ele chega até você.</li><li>Você confere.</li><li>Você lança e classifica no sistema (escritura).</li><li>O sistema ajuda a apurar os impostos.</li><li>Gera-se o SPED e outras declarações.</li><li>Faz-se a conciliação (para achar diferenças).</li><li>Tudo é arquivado para auditoria.</li></ol><p class='tip'><b>Na prática:</b> seu dia é sobretudo as etapas 4, 5, 8 e 9, com apoio nas etapas 6 e 7.</p><p class='tip'><b>Erro comum:</b> achar que “lançar” é só digitar. Lançar é entender o que a nota representa e classificar certo.</p><h3>Aula 2: Regimes tributários e tipos de empresa</h3><p><b>Por que isso importa tanto?</b> O regime é a “forma de pagar imposto” que a empresa escolheu (ou foi obrigada a usar). Dois colegas lançam a mesma nota em empresas diferentes e o tratamento pode ser totalmente diferente. A primeira pergunta no trabalho deve ser: “qual é o regime desta empresa?”</p><p><b>1) Simples Nacional:</b> voltado a pequenas empresas (limite de faturamento anual hoje na casa de R$ 4,8 milhões; confira o limite vigente). Os impostos são pagos juntos em uma guia única, o <b>DAS</b>, calculado sobre o faturamento. ICMS e ISS ficam dentro do DAS (em regra). As notas usam <b>CSOSN</b> em vez de CST. Em geral é dispensado do SPED Fiscal, mas a regra pode variar por estado: confirme.</p><p><b>2) Lucro Presumido:</b> o governo presume uma margem de lucro sobre o faturamento para calcular IRPJ e CSLL. PIS e COFINS são <b>cumulativos</b> (sem créditos): 0,65% e 3%. ICMS, IPI e ISS seguem as regras normais.</p><p><b>3) Lucro Real:</b> IRPJ/CSLL partem do lucro contábil ajustado, não de uma presunção. PIS e COFINS são <b>não cumulativos</b> (com créditos): 1,65% e 7,6%. É o regime mais detalhado e exige mais controle de créditos.</p><h3>Também precisa saber: o ramo da empresa</h3><table><tr><th>Ramo</th><th>O que costuma aparecer no fiscal</th></tr><tr><td>Comércio</td><td>Compra para revenda, ICMS, ST, PIS/COFINS</td></tr><tr><td>Indústria</td><td>Matéria-prima, IPI, produção, estoque</td></tr><tr><td>Serviços</td><td>NFS-e, ISS, retenções</td></tr></table><p class='tip'><b>Na prática:</b> abra o cadastro da empresa no sistema, descubra regime e ramo e anote no caderno. Isso guia tudo.</p><p class='tip'><b>Erro comum:</b> copiar o jeito de lançar de uma empresa e aplicar em outra sem checar o regime.</p><p class='tip'><b>Pare e pense:</b> se a empresa é do Lucro Real e comprou mercadoria para revenda, ela pode ter crédito de PIS/COFINS? (Não cumulativo = com créditos.)</p>",
q:[["O ICMS é cobrado por qual nível?",["União","Estado","Município"],1,"O ICMS é estadual (em MG, SEF/MG). ISS é municipal; IPI, PIS e COFINS são federais."],
["Base de R$ 5.000 e alíquota de 3%. Qual o imposto?",["R$ 15","R$ 150","R$ 1.500"],1,"Imposto = base × alíquota = 5.000 × 3% = R$ 150."],

["Empresa do Lucro Real: PIS/COFINS é…",["cumulativo, sem créditos","não cumulativo, com créditos"],1,"Lucro Real = não cumulativo (1,65% e 7,6%), com direito a crédito."]]},
{t:"O Documento Fiscal",au:"Aulas 3 e 4",l:"<h3>Aula 3: A nota fiscal por dentro</h3><p><b>Tipos de documento:</b> NF-e (modelo 55, mercadorias entre empresas); NFC-e (modelo 65, consumidor/varejo); NFS-e (serviços, prefeitura ou padrão nacional); CT-e (conhecimento de transporte, frete).</p><p><b>XML x DANFE:</b> o XML é o arquivo oficial, com valor legal. O DANFE é o PDF/impressão para humanos lerem. Se há diferença, vale o XML. Guarde sempre o XML.</p><h3>A chave de acesso (44 dígitos)</h3><p>É o “CPF da nota”. Com ela você consulta a nota no portal da NF-e e vê se está autorizada.</p><table><tr><th>Posição</th><th>Dígitos</th><th>O que é</th></tr><tr><td>1 a 2</td><td>2</td><td>Código da UF (31 = Minas Gerais)</td></tr><tr><td>3 a 6</td><td>4</td><td>Ano e mês de emissão (2610 = outubro de 2026)</td></tr><tr><td>7 a 20</td><td>14</td><td>CNPJ do emitente</td></tr><tr><td>21 a 22</td><td>2</td><td>Modelo (55 = NF-e)</td></tr><tr><td>23 a 25</td><td>3</td><td>Série</td></tr><tr><td>26 a 34</td><td>9</td><td>Número da nota</td></tr><tr><td>35</td><td>1</td><td>Tipo de emissão</td></tr><tr><td>36 a 43</td><td>8</td><td>Código numérico aleatório</td></tr><tr><td>44</td><td>1</td><td>Dígito verificador</td></tr></table><h3>Lendo uma nota, campo por campo</h3><table><tr><th>Campo</th><th>Para que serve</th></tr><tr><td>Natureza da operação</td><td>Descreve o tipo de operação (ex.: venda de mercadoria)</td></tr><tr><td>Emitente</td><td>Quem vendeu</td></tr><tr><td>Destinatário</td><td>Quem comprou (confira o CNPJ!)</td></tr><tr><td>Item</td><td>O que foi vendido e como foi classificado (ex.: camiseta, NCM 6109.10.00, CFOP 5102)</td></tr><tr><td>Qtd × valor unitário</td><td>100 × R$ 20,00 = total do item R$ 2.000,00</td></tr><tr><td>ICMS do item</td><td>Imposto destacado (ex.: CST 00, base 2.000, alíquota 18%, valor 360)</td></tr><tr><td>PIS/COFINS</td><td>Situação (CST) e valores</td></tr><tr><td>Totais</td><td>Produtos, frete, desconto, total: precisam fechar com a soma dos itens</td></tr><tr><td>Transporte</td><td>Frete por conta de quem</td></tr><tr><td>Cobrança</td><td>Duplicatas e vencimentos; alimenta o contas a pagar</td></tr><tr><td>Informações adicionais</td><td>Textos livres (ex.: FEM em MG)</td></tr><tr><td>Protocolo de autorização</td><td>Número e data: prova de que a SEFAZ autorizou</td></tr></table><h3>Eventos da NF-e</h3><p><b>Cancelamento:</b> a nota deixa de ter efeito; em regra há prazo curto (geralmente 24 horas, mas depende da legislação). Depois, o caminho costuma ser a devolução. <b>Carta de Correção (CC-e):</b> corrige apenas dados que não mudam valor, imposto, destinatário ou data. <b>Manifestação do destinatário:</b> a empresa informa ao Fisco que confirmou, desconheceu ou não realizou a operação.</p><p class='tip'><b>Na prática:</b> antes de lançar, consulte a situação no portal. Se cancelou, não entra.</p><p class='tip'><b>Erro comum:</b> lançar pelo PDF que chegou por e-mail sem conferir se a nota foi autorizada.</p><h3>Aula 4: CFOP, CST/CSOSN e NCM</h3><p><b>CFOP</b> tem 4 dígitos e diz o tipo de operação. O primeiro dígito indica sentido e destino:</p><table><tr><th>1º dígito</th><th>Significado</th></tr><tr><td>1</td><td>Entrada, do mesmo estado</td></tr><tr><td>2</td><td>Entrada, de outro estado</td></tr><tr><td>3</td><td>Entrada, do exterior</td></tr><tr><td>5</td><td>Saída, para o mesmo estado</td></tr><tr><td>6</td><td>Saída, para outro estado</td></tr><tr><td>7</td><td>Saída, para o exterior</td></tr></table><table><tr><th>CFOP</th><th>Significado</th></tr><tr><td>5101 / 6101</td><td>Venda de produção própria (dentro / fora do estado)</td></tr><tr><td>5102 / 6102</td><td>Venda de mercadoria adquirida de terceiros</td></tr><tr><td>1102 / 2102</td><td>Compra para comercialização</td></tr><tr><td>1202 / 2202</td><td>Devolução de venda</td></tr><tr><td>5202 / 6202</td><td>Devolução de compra</td></tr><tr><td>5949 / 1949</td><td>Outras saídas / entradas (uso genérico, confira se é o caso)</td></tr></table><h3>A regra de ouro da “inversão”</h3><p>O fornecedor emite a nota com o CFOP dele (saída: 5 ou 6). Você, ao escriturar a entrada, usa o CFOP correspondente de entrada (1 ou 2):</p><table><tr><th>Fornecedor emitiu</th><th>Origem</th><th>Você escritura</th></tr><tr><td>5102</td><td>Mesmo estado</td><td>1102</td></tr><tr><td>6102</td><td>Outro estado</td><td>2102</td></tr><tr><td>6101</td><td>Outro estado</td><td>2101</td></tr></table><p class='tip'><b>Erro comum:</b> escriturar a entrada com o mesmo CFOP da nota do fornecedor.</p><h3>CST e CSOSN: a situação do imposto</h3><p><b>CST do ICMS</b> (regime normal) tem 3 dígitos: o primeiro é a origem da mercadoria (0 = nacional, 1 = estrangeira de importação direta etc.) e os dois últimos, a tributação. Exemplos: 00 tributada integralmente; 10 tributada com ST; 20 com redução de base; 40 isenta; 41 não tributada; 51 diferimento; 60 ICMS cobrado anteriormente por ST. <b>CSOSN</b> é o equivalente para o Simples (ex.: 101, 102, 500). PIS/COFINS e IPI têm tabelas de CST próprias.</p><p class='tip'><b>Na prática:</b> o CST diz se o item gera crédito ou débito e como entra na apuração.</p><h3>NCM e CEST</h3><p><b>NCM:</b> código de 8 dígitos que classifica a mercadoria; dele dependem IPI, ST, tributação de PIS/COFINS etc. <b>CEST:</b> código de 7 dígitos usado em mercadorias com substituição tributária.</p><p class='tip'><b>Erro comum:</b> cadastrar o produto com o NCM errado. O erro se repete em todas as notas daquele produto.</p>",

{t:"Dominando os Impostos",au:"Aulas 5 a 8 e 12",l:"<h3>Aula 5: ICMS, o imposto estadual</h3><p><b>A história das laranjas.</b> Você compra uma caixa por R$ 100, já com R$ 18 de ICMS embutido (18%). Vende por R$ 200, com R$ 36 de ICMS. Como já adiantou R$ 18 na compra, repassa só R$ 36 − R$ 18 = R$ 18. O ICMS incide sobre o valor que você agregou, não duas vezes sobre o mesmo valor: isso é a <b>não cumulatividade</b>.</p><p class='tip'><b>ICMS a pagar = débitos (vendas) − créditos (compras com direito).</b> Se os créditos forem maiores, sobra saldo credor, transportado para o mês seguinte.</p><p><b>“Por dentro”:</b> o imposto já está incluído no preço; a nota apenas o destaca em campo próprio.</p><table><tr><th>Operação</th><th>Alíquota (regra geral)</th></tr><tr><td>Interna em MG</td><td>18%, com exceções por produto</td></tr><tr><td>MG para Sul e Sudeste (exceto ES)</td><td>12%</td></tr><tr><td>MG para Norte, Nordeste, Centro-Oeste e ES</td><td>7%</td></tr><tr><td>Importados (interestadual)</td><td>4%</td></tr></table><p><b>Substituição tributária (ST):</b> o estado cobra o imposto de toda a cadeia de uma vez, de um substituto (fabricante/importador). Quem compra depois recebe a mercadoria com o ICMS já pago e, em geral, não destaca nem paga de novo. O CST de ST (10, 30, 60, 70) e o CEST avisam: nunca trate como mercadoria normal.</p><p><b>DIFAL:</b> em venda interestadual a consumidor final não contribuinte, o destino fica com a diferença entre a alíquota interna e a interestadual. SP para consumidor em MG: 18% − 12% = 6 pontos percentuais, devidos a Minas.</p><p><b>FEM (só em MG):</b> adicional de 2 pontos percentuais em certas mercadorias (lista definida em norma), em operações internas para consumidor final. A nota precisa trazê-lo corretamente.</p><p><b>Quando NÃO há crédito:</b> em regra, uso e consumo (ex.: material de limpeza) e mercadorias com isenção ou não tributação. Pergunte à equipe como o sistema trata. <b>Outros termos:</b> diferimento (imposto adiado), isenção/redução de base, CIAP (crédito de bens do ativo imobilizado, em regra 1/48 por mês).</p><p class='tip'><b>Erro comum:</b> tomar crédito sem conferir se a operação dá direito. Crédito indevido é um dos erros mais caros em autuação.</p><h3>Aula 6: IPI, imposto sobre produtos industrializados</h3><p>É federal e incide sobre produtos industrializados: o contribuinte é quem fabrica ou importa. No comércio puro, o IPI vem destacado na compra, mas em regra não gera crédito (vira custo). Existem casos de equiparação a industrial: confirme com a equipe.</p><p><b>Cálculo “por fora”:</b> produto de R$ 1.000 com IPI de 10% → IPI R$ 100; total cobrado R$ 1.100. A alíquota vem do <b>NCM</b>, na tabela <b>TIPI</b> (“NT” = não tributado). É não cumulativo: débito de saída − crédito de entrada.</p><p class='tip'><b>Erro comum:</b> confundir “por dentro” (ICMS) com “por fora” (IPI) ao conferir o total da nota.</p><h3>Aula 7: PIS e COFINS</h3><p>Contribuições federais sobre o faturamento. Aparecem juntas.</p><table><tr><th>Modelo</th><th>Quem usa (em regra)</th><th>Créditos?</th><th>PIS</th><th>COFINS</th></tr><tr><td>Cumulativo</td><td>Lucro Presumido</td><td>Não</td><td>0,65%</td><td>3%</td></tr><tr><td>Não cumulativo</td><td>Lucro Real</td><td>Sim</td><td>1,65%</td><td>7,6%</td></tr></table><p><b>Cumulativo:</b> receita R$ 80.000 → PIS 520 + COFINS 2.400 = R$ 2.920. <b>Não cumulativo:</b> receita R$ 100.000 e compras com crédito de R$ 40.000 → débito PIS 1.650 e COFINS 7.600; crédito PIS 660 e COFINS 3.040; a pagar PIS 990 e COFINS 4.560 (total R$ 5.550).</p><p><b>Geram crédito (não cumulativo), em geral:</b> mercadorias para revenda, insumos, energia elétrica, aluguéis, fretes na compra e depreciação de bens. Use as regras que a empresa já adota.</p><p><b>Regimes especiais:</b> <b>monofásico</b> (imposto concentrado no fabricante/importador; o revendedor, em regra, tem alíquota zero) e alíquota zero, isenção, suspensão (sem imposto a pagar, mas o CST precisa estar correto). O <b>CST de PIS/COFINS</b> é o que o SPED Contribuições lê: 01 tributável básica, 04 monofásica com alíquota zero, 06 alíquota zero, 07 isenta, 08 sem incidência. O STF decidiu que o ICMS não compõe a base do PIS/COFINS: pergunte como a empresa aplica.</p><p class='tip'><b>Erro comum:</b> deixar o CST de PIS/COFINS “genérico” por pressa. Gera erro no SPED e imposto errado.</p><h3>Aula 8: ISS, NFS-e e retenções</h3><p><b>ISS:</b> imposto municipal sobre serviços (Lei Complementar 116/2003), alíquota de 2% a 5% definida pela prefeitura. R$ 10.000 a 3% = R$ 300. <b>NFS-e:</b> nota de serviços eletrônica; o padrão nacional está sendo adotado e algumas prefeituras, como Belo Horizonte, já exigem o Emissor Nacional conforme cronograma.</p><p><b>Prestador</b> faz o serviço e emite a nota; <b>tomador</b> contrata e recebe. Às vezes a lei manda o tomador reter o ISS e pagá-lo à prefeitura: NFS-e de R$ 5.000 com ISS de 3% retido → retido R$ 150; pago ao prestador R$ 4.850 (sem outras retenções).</p><p><b>Outras retenções comuns:</b> IRRF; CSLL, PIS e COFINS (em certos serviços, na casa de 4,65%); INSS (cessão de mão de obra, em regra 11%); ISS. Não decore percentuais: aplique a tabela interna da empresa e pergunte nos casos novos.</p><p class='tip'><b>Erro comum:</b> pagar o valor bruto da nota ao prestador sem descontar a retenção devida.</p><h3>Aula 12: Apuração na prática</h3><p>Apurar é calcular, no fim do mês, quanto de cada imposto pagar (ou quanto de crédito sobrou). Escrituração certa = apuração certa.</p><table><tr><th>Linha da apuração do ICMS</th></tr><tr><td>(+) Débitos das saídas</td></tr><tr><td>(+) Outros débitos / estornos de crédito</td></tr><tr><td>(−) Créditos das entradas</td></tr><tr><td>(−) Outros créditos</td></tr><tr><td>(−) Saldo credor do mês anterior</td></tr><tr><td>= ICMS a recolher ou saldo credor a transportar</td></tr></table><p>Exemplo 1: débitos 40.000 e créditos 25.000 → recolher R$ 15.000. Exemplo 2: débitos 40.000 e créditos 55.000 → saldo credor de R$ 15.000, sem pagamento. <b>PIS/COFINS cumulativo:</b> receita R$ 200.000 → PIS R$ 1.300 e COFINS R$ 6.000. <b>ISS:</b> receita de serviços R$ 60.000 a 2% = R$ 1.200 (com ajustes de retenções).</p><p><b>Como você ajuda:</b> garantir todas as notas lançadas; conferir CFOP/CST das notas de maior valor; revisar o relatório e comparar com o mês anterior; conferir créditos estranhos; avisar o responsável antes do vencimento.</p><p class='tip'><b>Pare e pense:</b> se o ICMS do mês dobrou, o que verificar primeiro? Vendas em duplicidade ou créditos de compras não lançados.</p>",

{t:"Escrituração e Conciliação",au:"Aulas 9 a 11, 14 e 15",l:"<h3>Aula 9: Lançamento e classificação contábil</h3><p>Pelo método das <b>partidas dobradas</b>, todo fato tem pelo menos um débito e um crédito, e a soma dos débitos é igual à dos créditos. O <b>plano de contas</b> é a lista de gavetas onde cada lançamento é guardado.</p><table><tr><th>Grupo</th><th>Representa</th><th>Natureza</th></tr><tr><td>Ativo</td><td>Caixa, estoque, clientes</td><td>Devedora</td></tr><tr><td>Passivo</td><td>Fornecedores, impostos a recolher</td><td>Credora</td></tr><tr><td>Patrimônio Líquido</td><td>Capital dos sócios</td><td>Credora</td></tr><tr><td>Receitas</td><td>Vendas e ganhos</td><td>Credora</td></tr><tr><td>Custos e despesas</td><td>Gastos</td><td>Devedora</td></tr></table><p><b>Compra a prazo de R$ 10.000 com ICMS recuperável de R$ 1.800:</b> D Estoque 8.200 / D ICMS a Recuperar 1.800 / C Fornecedores 10.000. O estoque fica sem o imposto recuperável, que vira crédito a abater depois.</p><p><b>Venda a prazo de R$ 20.000, ICMS 18% = R$ 3.600:</b> D Clientes 20.000 / C Receita de Vendas 20.000; D ICMS sobre Vendas (dedução) 3.600 / C ICMS a Recolher 3.600. O custo sai do estoque: D CMV / C Estoque.</p><p><b>Para classificar, pergunte:</b> (1) O que é isso (mercadoria, consumo, serviço, imobilizado)? (2) Será vendido ou consumido? (3) Qual centro de custo? (4) Gera crédito de imposto? Ex.: energia da loja é despesa; uma impressora pode ser imobilizado.</p><p><b>Competência:</b> vale o mês em que o fato aconteceu, não quando o dinheiro se moveu. Nota de dezembro paga em janeiro pertence a dezembro.</p><p class='tip'><b>Erro comum:</b> lançar tudo como “despesa diversa” para ganhar tempo. Distorce o resultado e atrapalha a auditoria.</p><h3>Aula 10: Escrituração de entradas e saídas</h3><p>Escriturar é registrar a nota nos livros fiscais (no sistema), indicando impostos e créditos/débitos. Isso alimenta a apuração e o SPED.</p><p><b>Entrada de mercadoria, passo a passo:</b></p><ol><li>Receba o XML.</li><li>Consulte a autorização no portal.</li><li>Confira emitente, destinatário (CNPJ da empresa!), itens, valores e impostos.</li><li>Importe o XML no sistema.</li><li>Vincule os produtos (“de-para”).</li><li>Defina o CFOP de entrada (5102 vira 1102; 6102 vira 2102).</li><li>Confira CST, créditos e retenções.</li><li>Confira conta contábil e centro de custo.</li><li>Salve e anexe XML/PDF.</li><li>Verifique o contas a pagar gerado.</li></ol><p><b>Saídas:</b> a nota costuma ser emitida pelo faturamento. O fiscal confere CFOP, CST e impostos, confere a numeração (sem buracos) e garante que está escriturada. Notas inutilizadas ou canceladas precisam estar tratadas.</p><table><tr><th>Operação especial</th><th>Cuidado</th></tr><tr><td>Devolução de venda</td><td>Entrada com CFOP 1202/2202; estorna o débito da venda</td></tr><tr><td>Devolução de compra</td><td>A empresa emite nota de saída 5202/6202</td></tr><tr><td>Bonificação / brinde</td><td>CFOP próprio; imposto conforme a regra</td></tr><tr><td>Remessa p/ conserto, demonstração, comodato</td><td>CFOP específico; pode ser sem tributação, mas exige retorno</td></tr><tr><td>Transferência entre filiais</td><td>CFOP próprio; cuidado com o CNPJ do estabelecimento</td></tr><tr><td>Frete (CT-e)</td><td>Outro documento; escritura separado; pode gerar crédito</td></tr><tr><td>Energia, telecom</td><td>Documentos próprios; créditos conforme a regra</td></tr></table><p class='tip'><b>Prazo:</b> escriture no mês correto, pois o SPED é mensal. Lançar no mês seguinte “porque deu tempo” muda impostos e conciliações.</p><h3>Aula 11: Conferir e organizar documentos</h3><p>Conformidade é fazer tudo de acordo com a lei e conseguir provar: documento, registro e explicação.</p><p><b>Checklist de uma NF-e:</b> (1) autorizada no portal? (2) CNPJ do destinatário é o da empresa? (3) chave com 44 dígitos e bate com a nota? (4) itens, quantidades e valores fecham com o total? (5) CFOP combina com a operação? (6) CST/CSOSN e impostos fazem sentido para o regime do fornecedor? (7) há eventos (cancelamento, CC-e)? (8) já foi lançada (duplicidade)? (9) há pedido de compra que justifique?</p><p><b>Notas que não chegaram:</b> consulte no portal da NF-e as notas emitidas para o CNPJ da empresa e compare com o que foi lançado. Evita surpresas na malha fiscal.</p><p><b>Guarda:</b> XML e PDF em pastas por ano, mês e tipo; em regra, 5 anos (confirme na empresa); nome padronizado, ex.: AAAAMM_Tipo_Numero_Fornecedor. Contratos, comprovantes e guias também têm lugar definido.</p><p><b>Quando algo está errado:</b> destinatário errado, peça correção ao fornecedor (pode exigir cancelamento e reemissão, no prazo); valor ou imposto errado, em geral não se corrige com CC-e (cancelamento, devolução ou nota complementar; o responsável decide); nota duplicada, não lance duas vezes, registre e avise.</p><p class='tip'><b>Erro comum:</b> “consertar” no sistema sem avisar ninguém e sem deixar rastro.</p><h3>Aula 14: Conciliação bancária e de contas</h3><p>Conciliar é comparar duas fontes que deveriam contar a mesma história e explicar as diferenças. <b>Bancária:</b> (1) pegue extrato e razão; (2) marque o que aparece nos dois lados; (3) liste as sobras; (4) classifique cada uma: diferença de data (normal, se resolve sozinha), falta de lançamento (tarifa, juros, PIX, débito automático: lance), erro de valor ou duplicidade (corrija) ou não identificado (leve ao responsável com o comprovante); (5) as diferenças explicadas devem fechar a conta.</p><p>Exemplo: razão R$ 21.500 e extrato R$ 20.000. Um depósito feito na sexta e creditado na segunda explica os R$ 1.500: é diferença de data. Outro exemplo: extrato R$ 50.000 e razão R$ 48.700; um PIX de R$ 1.300 foi creditado e o financeiro não baixou o título: lance a baixa.</p><table><tr><th>Conta</th><th>Compare com</th></tr><tr><td>Clientes</td><td>Relatório de títulos a receber</td></tr><tr><td>Fornecedores</td><td>Relatório de títulos a pagar</td></tr><tr><td>Impostos a recolher</td><td>Apuração e guias pagas</td></tr><tr><td>Impostos a recuperar</td><td>Relatório de créditos</td></tr><tr><td>Estoque</td><td>Inventário</td></tr><tr><td>Adiantamentos</td><td>Comprovantes e baixas</td></tr></table><p class='tip'><b>Erro comum:</b> “jogar” a diferença em outra conta para fechar. Conciliar é explicar cada diferença com um documento.</p><h3>Aula 15: Conciliação fiscal x contábil</h3><p>Compare: compras (notas de entrada x Compras/Estoque), vendas (notas de saída x Receita), impostos (apuração x impostos a recolher/recuperar) e devoluções.</p><p><b>Passo a passo:</b> tire o total nos dois lados; calcule a diferença; compare nota a nota; identifique a causa; corrija onde estiver o erro; documente (o que era, o que fez, quem aprovou).</p><p><b>Causas comuns:</b> nota só em um lado; nota cancelada em um lado; data de competência diferente; valor digitado errado; devolução esquecida; frete ou despesa acessória tratados de formas diferentes; nota lançada duas vezes.</p><p><b>Exemplo:</b> compras fiscais R$ 300.000 x contábeis R$ 296.500 = R$ 3.500. Você lista as notas e acha uma de R$ 3.500 que não foi integrada à contabilidade. Correção: lançar, anexar e registrar a causa.</p><p class='tip'><b>Dica de ouro:</b> se a diferença é igual ao valor de uma nota, ela está quase certamente só de um lado. Se é metade de um valor, pense em duplicidade. Diferença pequena hoje pode ser multa amanhã.</p>",

["Fornecedor de Uberlândia (MG) emitiu CFOP 5102. Sua entrada em BH?",["1102","2102","5102"],0,"Mesmo estado: 5102 vira 1102."],
["Fiscal R$ 300.000 x contábil R$ 296.500. Por onde começar?",["Ignorar, é pequena","Procurar uma nota de R$ 3.500 só de um lado","Lançar a diferença em outra conta"],1,"Diferença igual ao valor de uma nota: provavelmente está lançada só de um lado."],

["Por quanto tempo, em regra, guardam-se os documentos fiscais?",["1 ano","5 anos","30 dias"],1,"Em regra, 5 anos (confirme o prazo com a empresa)."]]},
{t:"Obrigações, Excel e Auditoria",au:"Aulas 13, 16 a 18",l:"<h3>Aula 13: SPED e obrigações acessórias</h3><p>Obrigação acessória é a declaração ao governo; a principal é pagar o imposto. <b>SPED Fiscal (EFD ICMS/IPI):</b> arquivo mensal com entradas, saídas, apuração de ICMS e IPI e inventário. Prazo em MG: em regra dia 15 do mês seguinte (confira o calendário do ano; janeiro de 2026 foi prorrogado por causa do Carnaval).</p><table><tr><th>Bloco</th><th>Conteúdo</th></tr><tr><td>0</td><td>Abertura e cadastros (participantes, produtos)</td></tr><tr><td>C</td><td>Documentos fiscais de mercadorias (NF-e)</td></tr><tr><td>D</td><td>Transporte e comunicação</td></tr><tr><td>E</td><td>Apuração de ICMS e IPI</td></tr><tr><td>G</td><td>CIAP (ativo imobilizado)</td></tr><tr><td>H</td><td>Inventário</td></tr><tr><td>K</td><td>Controle de produção e estoque (indústria)</td></tr><tr><td>9</td><td>Encerramento</td></tr></table><p><b>SPED Contribuições (EFD PIS/COFINS):</b> receitas, créditos e apuração; prazo, em regra, até o 10º dia útil do segundo mês após o período. <b>Para conhecer:</b> ECD, ECF, DCTF/DCTFWeb, EFD-Reinf, eSocial, PGDAS-D e DEFIS (Simples), DeSTDA.</p><p><b>Como você ajuda:</b> feche e confira os lançamentos; gere o arquivo; valide no <b>PVA</b>; separe <b>erro</b> (impede a entrega) de <b>aviso</b> (merece análise); corrija na origem, não só no arquivo; valide de novo; compare totais com a apuração e a contabilidade; o responsável assina e transmite com certificado digital; guarde o recibo.</p><p><b>Erros clássicos do PVA:</b> participante sem dados completos; produto sem NCM ou unidade inconsistente; CST incompatível com o valor do imposto; totais da nota que não fecham; notas do portal não escrituradas.</p><h3>Aula 16: Excel para a rotina fiscal</h3><p class='tip'><b>Cuidado:</b> o Excel guarda só 15 dígitos de precisão e a chave tem 44. Formate a coluna como <b>Texto</b> antes de colar (Ctrl+1), senão vira notação científica e perde dígitos. Vale também para CNPJ e códigos com zero à esquerda.</p><table><tr><th>Função</th><th>Uso</th><th>Exemplo</th></tr><tr><td>PROCV</td><td>Procurar valor em outra lista</td><td>=PROCV(A2;Portal!A:B;2;0)</td></tr><tr><td>SOMASE</td><td>Somar com condição</td><td>=SOMASE(B:B;&quot;5102&quot;;C:C)</td></tr><tr><td>SOMASES</td><td>Várias condições</td><td>=SOMASES(C:C;B:B;&quot;5102&quot;;D:D;&quot;jan&quot;)</td></tr><tr><td>CONT.SE</td><td>Contar ocorrências</td><td>=CONT.SE(A:A;A2)</td></tr><tr><td>SE</td><td>Testar</td><td>=SE(C2&lt;&gt;D2;&quot;Conferir&quot;;&quot;OK&quot;)</td></tr><tr><td>SEERRO</td><td>Tratar erro</td><td>=SEERRO(PROCV(...);&quot;Não achei&quot;)</td></tr><tr><td>ARRUMAR</td><td>Tirar espaços</td><td>=ARRUMAR(A2)</td></tr><tr><td>EXT.TEXTO</td><td>Pegar parte do texto</td><td>=EXT.TEXTO(A2;7;14) (CNPJ da chave)</td></tr></table><p><b>Recursos:</b> tabela dinâmica, remover duplicados, filtro (Ctrl+Shift+L), formatação condicional, Ctrl+T e referência fixa (F4).</p><p><b>Portal x sistema:</b> aba Portal com as chaves; aba Sistema com as lançadas; na coluna B do Portal use =SEERRO(PROCV(A2;Sistema!A:A;1;0);&quot;NÃO LANÇADA&quot;) e filtre. Faça sempre uma cópia do arquivo antes de mexer. Essa planilha reaproveitada todo mês mostra iniciativa.</p><h3>Aula 17: Suporte a auditorias</h3><p><b>Interna:</b> equipe da própria empresa checa controles. <b>Externa:</b> empresa independente (balanços, investidores). <b>Fiscalização:</b> feita pelo Fisco (SEF/MG, Receita, prefeitura) e pode autuar. O auditor costuma pedir notas (XML/PDF), guias pagas, SPED e recibos, conciliações, explicações e documentos de suporte.</p><p><b>Trilha de auditoria:</b> o rastro nota → lançamento → apuração → guia → pagamento. <b>Atendendo um pedido:</b> leia com calma e tire dúvidas; anote o prazo e avise o responsável; localize; confira se está completo e legível; envie com um índice; registre o que enviou; se não achar, diga que está procurando, sem inventar.</p><p class='tip'><b>Postura:</b> honestidade acima de tudo, clareza, sigilo e calma. Pedir tempo para confirmar é aceitável. <b>Erro comum:</b> responder de memória o que você não tem certeza.</p><h3>Aula 18: Rotina, postura e Reforma Tributária</h3><table><tr><th>Dia</th><th>Foco</th></tr><tr><td>Segunda</td><td>Notas acumuladas do fim de semana; pendências</td></tr><tr><td>Terça e quarta</td><td>Lançamentos, CFOP/CST, dúvidas com fornecedores</td></tr><tr><td>Quinta</td><td>Conciliações; portal x sistema</td></tr><tr><td>Sexta</td><td>Fechamento da semana, arquivos, pendências</td></tr></table><p>No fim do mês entram fechamento, apuração, conciliação fiscal x contábil e SPED.</p><p><b>Hábitos de quem é confiável:</b> conferir antes de salvar; anotar o que fez; avisar cedo; perguntar com contexto; pesquisar em fonte oficial; guardar sigilo; aprender com o erro sem se culpar demais. <b>Onde pesquisar:</b> Portal SPED, Portal da NF-e, SEF/MG (RICMS/MG, calendários), Receita Federal, prefeitura (ISS e NFS-e), equipe e contador.</p><p><b>Reforma Tributária:</b> a CBS (federal) substitui PIS/COFINS; o IBS (estados e municípios) substitui ICMS e ISS; o IS (Imposto Seletivo) incide sobre itens nocivos à saúde e ao meio ambiente. Linha do tempo (confirme os detalhes): 2026, teste com alíquotas pequenas e novos campos nos documentos; 2027, CBS substitui PIS/COFINS e o IS começa; 2029 a 2032, redução gradual de ICMS e ISS e aumento do IBS; 2033, modelo novo, com extinção de ICMS e ISS. Hoje, ICMS, ISS, PIS e COFINS continuam sendo a rotina. Perguntar “como a empresa está se preparando?” mostra interesse.</p>",

{t:"Desafio Final: Mineira Distribuidora",au:"Caso prático",l:"<p>A <b>Mineira Distribuidora Ltda.</b> fica em Belo Horizonte (MG), é do <b>Lucro Presumido</b> (PIS/COFINS cumulativos) e revende mercadorias sem ST. Operações do mês:</p><table><tr><th>Nº</th><th>Operação</th><th>Valor</th><th>ICMS</th></tr><tr><td>1</td><td>Compra para revenda de Uberlândia (MG), CFOP do fornecedor 5102, a prazo</td><td>R$ 10.000</td><td>18% = 1.800</td></tr><tr><td>2</td><td>Compra para revenda de São Paulo, CFOP do fornecedor 6102</td><td>R$ 5.000</td><td>12% = 600</td></tr><tr><td>3</td><td>Venda a cliente de BH, contribuinte</td><td>R$ 20.000</td><td>18% = 3.600</td></tr><tr><td>4</td><td>Venda a cliente de Salvador (BA), contribuinte</td><td>R$ 8.000</td><td>7% = 560</td></tr><tr><td>5</td><td>Devolução de parte da venda 3 pelo cliente de BH</td><td>R$ 2.000</td><td>18% = 360</td></tr></table><h3>Como resolver, passo a passo</h3><p><b>1) CFOPs (inversão):</b> compra 1: 5102 vira <b>1102</b>; compra 2: 6102 vira <b>2102</b>; venda 3 (dentro do estado, mercadoria de terceiros): <b>5102</b>; venda 4 (outro estado): <b>6102</b>; devolução do cliente de BH: <b>1202</b>.</p><p><b>2) ICMS:</b> débitos = 3.600 + 560 = 4.160. Créditos = 1.800 + 600 + 360 (a devolução estorna o débito, entra como crédito) = 2.760. A pagar = 4.160 − 2.760 = <b>R$ 1.400</b>.</p><p><b>3) PIS/COFINS cumulativos:</b> receita líquida = 20.000 + 8.000 − 2.000 = R$ 26.000. PIS = 26.000 × 0,65% = 169. COFINS = 26.000 × 3% = 780. Total = <b>R$ 949</b>.</p><p><b>4) Lançamento da compra 1:</b> D Estoque 8.200 / D ICMS a Recuperar 1.800 / C Fornecedores 10.000.</p><p class='tip'>Tente resolver sozinha antes de abrir o quiz: o certificado final exige o ICMS de R$ 1.400 e o PIS/COFINS de R$ 949 corretos.</p>",

[[["Qual a fórmula de ouro do imposto?",["base × alíquota","base + alíquota","alíquota ÷ base"],0,"Imposto = base de cálculo × alíquota. Ex.: 1.000 × 18% = R$ 180."],["Como o Fisco percebe que você esqueceu de lançar uma nota?",["Pelo contador","Toda NF-e é autorizada na SEFAZ e o SPED é cruzado com essas notas","Não percebe"],1,"O Fisco já recebe cópia de toda nota eletrônica. Se ela não está no SPED, a diferença aparece."]],[["Quantos dígitos tem a chave de acesso da NF-e?",["34","44","14"],1,"44 dígitos: UF, ano/mês, CNPJ, modelo, série, número, tipo de emissão, código numérico e dígito verificador."],["CFOP que começa com 6 indica…",["Entrada de outro estado","Saída para o mesmo estado","Saída para outro estado"],2,"1/2/3 são entradas; 5/6/7 são saídas. O 6 é saída para outro estado."]],[["Lucro Real, receita R$ 100.000 e compras com crédito de R$ 40.000. PIS a pagar?",["R$ 990","R$ 660","R$ 1.650"],0,"Débito 1.650 − crédito 660 = R$ 990. COFINS: 7.600 − 3.040 = R$ 4.560."],["Quem é o tomador de um serviço?",["Quem presta o serviço","Quem contrata e recebe o serviço","A prefeitura"],1,"Prestador faz e emite a nota; tomador contrata e recebe. É ele quem pode ter de reter o ISS."]],[["Uma nota de dezembro paga em janeiro pertence a qual mês?",["Janeiro","Dezembro"],1,"Regime de competência: vale o mês em que o fato aconteceu, não quando o dinheiro saiu."],["Qual a natureza normal da conta de Receitas?",["Devedora","Credora"],1,"Receitas, Passivo e Patrimônio Líquido são credoras. Ativo e despesas são devedoras."]],[["Qual função do Excel cruza a lista do portal com a do sistema pela chave?",["SOMASE","PROCV (ou PROCX)","ARRUMAR"],1,"O que retornar #N/D no PROCV está no portal e não foi lançado."],["No PVA, o que impede a entrega do SPED?",["Aviso","Erro"],1,"Erro impede a entrega e deve ser corrigido na origem. Aviso merece análise."]],[["Qual a receita líquida da Mineira Distribuidora após a devolução?",["R$ 28.000","R$ 26.000","R$ 20.000"],1,"20.000 + 8.000 − 2.000 = R$ 26.000. É a base do PIS/COFINS cumulativo."],["CFOP de saída da venda 4, para cliente de Salvador?",["5102","6102","2102"],1,"Mercadoria de terceiros vendida para outro estado: 6102."]]].forEach(function(a,i){a.forEach(function(q){M[i].q.push(q)})});
[[["ISS é cobrado por qual nível?", ["Federal", "Estadual", "Municipal"], 2, "ISS é municipal (S de Serviço, prefeitura). IPI é federal e ICMS é estadual."],["O Simples Nacional dispensa a guarda de notas fiscais?", ["Verdadeiro", "Falso"], 1, "Muda a forma de pagar (guia única), mas a empresa continua obrigada a guardar documentos fiscais e manter controles. Resposta: Falso."],["Por que saber o regime antes de lançar uma nota?", ["Ele define alíquotas, créditos, códigos (CST/CSOSN) e obrigações", "Só serve para o certificado digital", "Não faz diferença"], 0, "O mesmo lançamento pode ter tratamento diferente em cada regime."]],[["Nota que você já lançou aparece cancelada no portal. O que fazer?", ["Deixar como está", "Avisar o responsável, estornar/cancelar o lançamento (inclusive o contas a pagar) e registrar", "Apagar o XML"], 1, "Nota cancelada não vale. Corrija conforme o procedimento da empresa e deixe rastro."],["Venda a cliente de MG de mercadoria adquirida de terceiros: CFOP? E se fosse produção própria?", ["5102; 5101", "6102; 6101", "1102; 1101"], 0, "Dentro do estado começa com 5: 5102 (terceiros) e 5101 (produção própria)."],["O que é o NCM?", ["Código de 8 dígitos que classifica a mercadoria", "Código da operação", "Número da nota"], 0, "Nomenclatura Comum do Mercosul: dela dependem IPI, ST e outros tratamentos."]],[["Na ST, o imposto das etapas seguintes é pago antecipadamente por um contribuinte substituto.", ["Verdadeiro", "Falso"], 0, "Verdadeiro. O substituído recebe a mercadoria com o ICMS já pago."],["Quem é o contribuinte típico do IPI?", ["Comércio varejista", "Fabricante e importador", "Prefeitura"], 1, "O IPI incide sobre produtos industrializados."],["Onde se descobre a alíquota do IPI?", ["Pelo NCM, na tabela TIPI", "No CFOP", "Na chave de acesso"], 0, "NT na TIPI significa não tributado."],["O IPI é um imposto cumulativo.", ["Verdadeiro", "Falso"], 1, "Falso. É não cumulativo: débito de saída menos crédito de entrada."],["No regime monofásico, o revendedor, em regra…", ["recolhe PIS/COFINS normalmente", "tem alíquota zero nas vendas"], 1, "O imposto já foi concentrado no fabricante/importador."],["O que o CST de PIS/COFINS informa?", ["A situação tributária do item (tributada, monofásica, alíquota zero, isenta, com ou sem crédito)", "O número da nota", "O prazo do SPED"], 0, "É ele que o SPED Contribuições lê."],["Serviço de R$ 8.000 com ISS de 5%. Qual o ISS?", ["R$ 40", "R$ 400", "R$ 4.000"], 1, "8.000 × 5% = R$ 400."],["Todo serviço tem exatamente as mesmas retenções.", ["Verdadeiro", "Falso"], 1, "Falso. Variam por serviço, valor, regime do prestador e município. Use a tabela da empresa."],["Débitos de ICMS de R$ 40.000 e créditos de R$ 55.000, sem saldo anterior. Resultado?", ["Pagar R$ 15.000", "Saldo credor de R$ 15.000 para o mês seguinte", "Pagar R$ 95.000"], 1, "Créditos maiores que débitos: não há pagamento, o saldo é transportado."],["Presumido com receita de R$ 200.000. PIS e COFINS cumulativos?", ["R$ 1.300 e R$ 6.000", "R$ 3.300 e R$ 15.200", "R$ 650 e R$ 3.000"], 0, "200.000 × 0,65% = 1.300 e × 3% = 6.000."],["Por que escrituração errada leva a apuração errada?", ["A apuração é calculada a partir das notas escrituradas", "Por azar", "As duas são independentes"], 0, "Se CFOP, CST, valores ou datas estão errados, o cálculo sai errado."],["Receita de serviços de R$ 60.000 e ISS de 2%. Qual o ISS?", ["R$ 120", "R$ 1.200", "R$ 12.000"], 1, "60.000 × 2% = R$ 1.200."]],[["Qual a regra básica das partidas dobradas?", ["Débitos sempre maiores que créditos", "Em cada lançamento, soma dos débitos = soma dos créditos", "Só se lança crédito"], 1, "Todo fato tem ao menos um débito e um crédito de mesmo valor total."],["A conta de energia elétrica da loja é…", ["Estoque", "Despesa"], 1, "A energia é consumida, não revendida (pode ter crédito conforme a regra)."],["Que conferências fazer antes de escriturar uma entrada?", ["Autorização no portal, CNPJ do destinatário, itens/valores/impostos e CFOP", "Só o valor total", "Nenhuma, o sistema confere"], 0, "Também CST, conta contábil, centro de custo e duplicidade."],["Devolver mercadoria a fornecedor do mesmo estado: quem emite e com qual CFOP?", ["O fornecedor, 1202", "A própria empresa, nota de saída 5202", "A própria empresa, 1102"], 1, "Devolução de compra dentro do estado: nota de saída com CFOP 5202."],["O frete da compra veio em CT-e. Ele é lançado…", ["junto com a nota de mercadoria", "em separado, pois é outro documento"], 1, "O CT-e é escriturado separado e pode gerar crédito."],["Para que serve consultar a chave de acesso no portal?", ["Confirmar que a nota existe, está autorizada e ver eventos", "Calcular o ICMS", "Gerar o SPED"], 0, "Também mostra cancelamento e CC-e."],["A mesma nota chegou duas vezes. O que fazer?", ["Lançar as duas", "Lançar uma vez, registrar a duplicidade e avisar o responsável", "Apagar as duas"], 1, "Evita imposto e conciliação errados."],["Depois de lançada a nota, pode-se apagar o XML e guardar só o PDF.", ["Verdadeiro", "Falso"], 1, "Falso. O XML tem valor legal e deve ser guardado."],["A tarifa bancária aparece no extrato e não no razão. O que fazer?", ["Ignorar", "Lançar como despesa bancária, com comprovante, no mês correto", "Jogar em outra conta"], 1, "Falta de lançamento da empresa: lance."],["A conta ICMS a Recolher compara-se com…", ["O inventário", "A apuração do ICMS e a guia (DAE) paga", "O relatório de títulos a receber"], 1, "Se apuração, guia e saldo batem, está conciliado."],["Por que é errado jogar a diferença em outra conta para a conciliação fechar?", ["Esconde o problema; conciliar é explicar cada diferença com documento", "Porque o sistema trava", "Não é errado"], 0, "Isso vira problema em auditoria."],["Qual é um conjunto de causas comuns de divergência fiscal x contábil?", ["Nota só em um lado, cancelada, data diferente, valor errado, devolução esquecida", "Tamanho do arquivo", "Horário do lançamento"], 0, "Também nota duplicada e frete tratado de formas diferentes."],["Uma diferença pequena pode ser ignorada.", ["Verdadeiro", "Falso"], 1, "Falso. Pode esconder um erro maior e virar multa."],["Depois de achar e corrigir a divergência, o que falta?", ["Nada", "Documentar causa, correção e quem aprovou, e evitar que se repita", "Apagar o histórico"], 1, "Rastreabilidade é parte do trabalho."]],[["Para que guardar o recibo de entrega do SPED?", ["Prova de que o arquivo foi entregue e recebido", "Para calcular imposto", "Não precisa guardar"], 0, "É a prova da entrega."],["O que faz =SEERRO(PROCV(A2;Sistema!A:A;1;0);“NÃO LANÇADA”)?", ["Busca a chave de A2 no Sistema e, se não achar, escreve NÃO LANÇADA", "Soma a coluna A", "Remove duplicados"], 0, "Troca o erro #N/D por um texto fácil de filtrar."],["Qual fórmula soma a coluna C onde B é 5102?", ["=SOMASE(B:B;“5102”;C:C)", "=PROCV(B:B;5102;C)", "=CONT.SE(C:C;5102)"], 0, "SOMASE(intervalo do critério; critério; intervalo da soma)."],["Se você não souber responder numa auditoria, o melhor é inventar uma resposta que pareça correta.", ["Verdadeiro", "Falso"], 1, "Falso. Diga “vou confirmar” e traga a evidência."],["O que é trilha de auditoria?", ["O rastro nota → lançamento → apuração → guia → pagamento", "Lista de funcionários", "Um tipo de multa"], 0, "Com a trilha clara, a auditoria é tranquila."],["Qual a diferença entre auditoria interna e fiscalização?", ["Interna checa controles na empresa; fiscalização é do governo e pode autuar", "São a mesma coisa", "Fiscalização é feita pela própria empresa"], 0, "Só a fiscalização do Fisco aplica multa."],["Em 2026, o ICMS já foi totalmente extinto.", ["Verdadeiro", "Falso"], 1, "Falso. A transição é gradual, com extinção prevista para 2033."],["Qual é hábito de profissional fiscal de confiança?", ["Conferir antes de salvar, anotar o que fez e avisar cedo", "Resolver tudo de memória", "Alterar período fechado sem avisar"], 0, "Também: perguntar com contexto, pesquisar em fonte oficial e guardar sigilo."],["Onde pesquisar uma mudança recente de regra de NF-e ou SPED?", ["Portal SPED, Portal da NF-e, SEF/MG, Receita, equipe/contador", "Redes sociais", "Em lugar nenhum"], 0, "Sempre em fonte oficial."]],[["CFOP de saída da venda 3 (BH) e da venda 4 (Salvador)?", ["5102 e 6102", "6102 e 5102", "5101 e 6101"], 0, "Mercadoria de terceiros: 5102 dentro do estado e 6102 para outro estado."]]].forEach(function(a,i){a.forEach(function(q){M[i].q.push(q)})});
